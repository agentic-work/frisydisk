name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            bundles: app
          - name: Windows
            os: windows-latest
            bundles: nsis
          - name: Linux
            os: ubuntu-latest
            bundles: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Core tests
        run: cargo test -p frisy-core

      - name: Layout tests
        run: node --test ui/layout.test.js

      - name: Scan a real folder with the CLI
        shell: bash
        run: cargo run --release -p frisy-core --bin frisyscan -- "$HOME" --top 8

      - name: Terminal app
        shell: bash
        run: |
          cargo build --release -p frisy-core --bin frisyscan
          exe=target/release/frisyscan; [ "$RUNNER_OS" = Windows ] && exe=$exe.exe
          platform=unix; [ "$RUNNER_OS" = Windows ] && platform=windows-x64
          scripts/package-cli.sh "$platform" 0.0.0 "$exe"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "build\\cli\\frisy\\frisy.cmd" --print "$GITHUB_WORKSPACE"
            cmd //c "build\\cli\\frisy\\frisy.cmd" du -c "$GITHUB_WORKSPACE" "$HOME"
            cmd //c "build\\cli\\frisy\\frisy.cmd" clean --print
          else
            build/cli/frisy/frisy --print "$GITHUB_WORKSPACE"
            build/cli/frisy/frisy du -c "$GITHUB_WORKSPACE" "$HOME"
            build/cli/frisy/frisy clean --print
          fi

      - name: Build the app
        if: matrix.bundles != ''
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}

      # The app has to open a window and stay up while it scans.
      - name: Launch the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath target/release/frisydisk.exe -ArgumentList '--scan', $env:GITHUB_WORKSPACE, '--mode', 'sankey' -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "FrisyDisk exited with code $($p.ExitCode)" }
          $p.Refresh()
          if ($p.MainWindowHandle -eq 0) { throw "FrisyDisk has no window" }
          "window title: $($p.MainWindowTitle)"
          Stop-Process -Id $p.Id

      - name: Launch the app (macOS)
        if: runner.os == 'macOS'
        run: |
          target/release/bundle/macos/FrisyDisk.app/Contents/MacOS/frisydisk --scan "$GITHUB_WORKSPACE" &
          pid=$!
          sleep 10
          kill -0 $pid
          kill $pid

      - uses: actions/upload-artifact@v4
        if: matrix.bundles != ''
        with:
          name: FrisyDisk-${{ matrix.name }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/macos/*.app
          if-no-files-found: error
