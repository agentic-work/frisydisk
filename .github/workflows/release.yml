name: Release

# Push a tag like v0.2.0 to build the installers and attach them to a draft
# GitHub Release. Review the draft, then publish it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        run: |
          version=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"; exit 1; }
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "FrisyDisk ${GITHUB_REF_NAME#v}" --generate-notes

  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit
      - name: npm audit
        run: |
          npm audit --audit-level=moderate
          ( cd cli && npm audit --audit-level=moderate )

  build:
    name: ${{ matrix.name }}
    needs: [draft, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: cargo test -p frisy-core

      # With the Azure secrets set, the app and its installer are signed through
      # Azure Artifact Signing, so SmartScreen shows the publisher instead of a
      # warning. Without them the build is unsigned.
      - name: Build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          if ($env:AZURE_CLIENT_SECRET -and $env:SIGNING_PROFILE) {
            "Azure Artifact Signing is on"
            cargo install trusted-signing-cli --locked
            $sign = "trusted-signing-cli -e $env:SIGNING_ENDPOINT -a $env:SIGNING_ACCOUNT -c $env:SIGNING_PROFILE -d FrisyDisk %1"
            @{ bundle = @{ windows = @{ signCommand = $sign } } } | ConvertTo-Json -Depth 5 | Set-Content sign.conf.json
            npx tauri build --bundles nsis --config sign.conf.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # The installer is what people download, so it must carry a valid signature.
            foreach ($f in (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName) {
              $sig = Get-AuthenticodeSignature $f
              "$f : $($sig.Status) $($sig.SignerCertificate.Subject)"
              if ($sig.Status -ne "Valid") { throw "$f is not signed" }
            }
          } else {
            "No Azure signing secrets: the installer is unsigned"
            npx tauri build --bundles nsis
          }

      # One DMG that runs on both Apple silicon and Intel Macs. With the Apple
      # secrets set it is Developer ID signed and notarised; without them it is
      # ad-hoc signed, and people must right-click > Open the first time.
      - name: Build the macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing is on"
            if [ -n "$APPLE_API_KEY_P8" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
              printf '%s' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            else
              unset APPLE_API_ISSUER APPLE_API_KEY
              echo "no notary key: the app will be signed but not notarised"
            fi
          else
            echo "No Apple secrets: ad-hoc signing"
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY
            export APPLE_SIGNING_IDENTITY="-"
          fi
          unset APPLE_API_KEY_P8
          npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/bundle/nsis/*-setup.exe "FrisyDisk-$v-windows-x64-setup.exe"
          else
            cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "FrisyDisk-$v-macos-universal.dmg"
          fi
          gh release upload "$GITHUB_REF_NAME" FrisyDisk-"$v"-* --clobber

  # The terminal app: frisyscan plus the Ink interface and launchers, one
  # archive per platform. Linux builds are static (musl), so they run on any distribution.
  cli:
    name: Terminal app ${{ matrix.platform }}
    needs: [draft, audit]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { platform: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { platform: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: macos-universal, os: macos-latest, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || 'aarch64-apple-darwin,x86_64-apple-darwin' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frisyscan
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
            cargo build --release -p frisy-core --bin frisyscan --target ${{ matrix.target }}
            echo "SCANNER=target/${{ matrix.target }}/release/frisyscan" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = Windows ]; then
            cargo build --release -p frisy-core --bin frisyscan
            echo "SCANNER=target/release/frisyscan.exe" >> "$GITHUB_ENV"
          else
            cargo build --release -p frisy-core --bin frisyscan --target aarch64-apple-darwin
            cargo build --release -p frisy-core --bin frisyscan --target x86_64-apple-darwin
            lipo -create -output frisyscan target/aarch64-apple-darwin/release/frisyscan target/x86_64-apple-darwin/release/frisyscan
            echo "SCANNER=frisyscan" >> "$GITHUB_ENV"
          fi

      - name: Sign frisyscan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if (-not $env:AZURE_CLIENT_SECRET) { "No Azure signing secrets: unsigned"; exit 0 }
          cargo install trusted-signing-cli --locked
          trusted-signing-cli -e "${{ vars.AZURE_SIGNING_ENDPOINT }}" -a "${{ vars.AZURE_SIGNING_ACCOUNT }}" -c "${{ vars.AZURE_SIGNING_PROFILE }}" -d "FrisyDisk" $env:SCANNER
          $sig = Get-AuthenticodeSignature $env:SCANNER
          "$($env:SCANNER): $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne "Valid") { throw "frisyscan.exe is not signed" }

      - name: Sign frisyscan (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then codesign --force --sign - frisyscan; exit 0; fi
          kc="$RUNNER_TEMP/signing.keychain-db"; pw=$(openssl rand -hex 16)
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 900 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$kc" --options runtime --timestamp frisyscan
          codesign -dvv frisyscan 2>&1 | grep -E "Authority=Developer ID Application|flags="
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Package and smoke-test
        shell: bash
        run: |
          archive=$(scripts/package-cli.sh ${{ matrix.platform }} "${GITHUB_REF_NAME#v}" "$SCANNER" | tail -1)
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            cmd //c "build\\cli\\frisy\\frisy.cmd" --print "$GITHUB_WORKSPACE"
          else
            build/cli/frisy/frisy --print "$GITHUB_WORKSPACE"
            file build/cli/frisy/frisyscan
          fi

      - name: Attach to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" --clobber
